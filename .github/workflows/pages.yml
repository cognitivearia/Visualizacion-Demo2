name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Sin static_site_generator: next. Esa opción solo lee next.config.js
      # y, con next.config.ts, escribe un next.config.js vacío que tapa
      # trailingSlash y el base path del proyecto.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Export static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Check export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${NEXT_PUBLIC_BASE_PATH%/}"
          repo="/${GITHUB_REPOSITORY#*/}"
          test -n "$base"
          test "$base" = "$repo"
          test -f out/index.html
          test -f out/mundo/index.html
          test -f out/datos/index.html
          test -f out/graficos/mapa/index.html
          test -f out/.nojekyll
          test ! -f next.config.js
          grep -q "${base}/" out/index.html
          echo "Export listo en ${base}/"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
